<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olena Polishchuk</title>
<style>
  :root { --bg:#fbfaf8; --fg:#1c1a17; --muted:#6b6560; --line:#e3ded6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --fg:#eeeae4; --muted:#9b948c; --line:#302d29; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:400 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px;
  }
  main { max-width:34rem; }
  h1 { font-size:1.5rem; font-weight:600; margin:0 0 1.25rem; letter-spacing:-0.01em; }
  p { margin:0 0 1rem; }
  .muted { color:var(--muted); font-size:0.95rem; }
  hr { border:0; border-top:1px solid var(--line); margin:1.75rem 0; }
</style>
</head>
<body>
<main>
  <h1>Olena Polishchuk</h1>
  <p>Тут лежать мої артефакти - презентації, гайди й документи, які зручніше відкрити
     посиланням, ніж пересилати файлом.</p>
  <p class="muted">Кореневої сторінки зі списком поки немає. Посилання на кожен артефакт
     я даю окремо.</p>
  <hr>
  <p class="muted">QA, BetterMe</p>
</main>
</body>
</html>
